name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install dependencies
        run: npm install
      - name: Diagnose JSX syntax
        run: |
          npm install --no-save @babel/parser
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {parse} from '@babel/parser';
          const s=fs.readFileSync('src/main.jsx','utf8');
          const re=/\nfunction\s+([A-Za-z0-9_]+)\s*\(/g;
          const hits=[]; let m;
          while((m=re.exec(s))) hits.push({name:m[1],start:m.index+1,line:s.slice(0,m.index+1).split('\n').length});
          for(let i=0;i<hits.length;i++){
            const a=hits[i].start, b=i+1<hits.length?hits[i+1].start:s.length;
            const chunk=s.slice(a,b);
            try{parse(chunk,{sourceType:'module',plugins:['jsx']});}
            catch(e){console.log(JSON.stringify({function:hits[i].name,line:hits[i].line,reason:e.reasonCode,message:e.message,loc:e.loc})); process.exit(1);}
          }
          console.log('All function declaration chunks parse independently');
          NODE
      - name: Build production bundle
        run: npm run build
      - name: Smoke test built app
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/hll-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:4173';
          let response;
          for (let i = 0; i < 30; i++) {
            try {
              response = await fetch(base);
              if (response.ok) break;
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          assert.ok(response?.ok, 'Vite preview did not serve the built app');
          const html = await response.text();
          assert.match(html, /<div id="root"><\/div>/, 'App root is missing from built HTML');
          const assets = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(m => m[1]);
          assert.ok(assets.some(path => path.endsWith('.js')), 'Built JavaScript asset is missing');
          for (const asset of assets) {
            const assetResponse = await fetch(new URL(asset, base));
            assert.ok(assetResponse.ok, `Built asset failed: ${asset} (${assetResponse.status})`);
          }
          console.log(`Production preview smoke test passed (${assets.length} assets)`);
          NODE
