name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install dependencies
        run: npm install
      - name: Parse JSX syntax
        run: |
          npm install --no-save @babel/parser
          node --input-type=module -e "import fs from 'node:fs'; import {parse} from '@babel/parser'; const a=parse(fs.readFileSync('src/main.jsx','utf8'), {sourceType:'module', plugins:['jsx'], errorRecovery:true}); console.log(a.errors.map(e=>({reason:e.reasonCode,line:e.loc?.line,column:e.loc?.column,message:e.message}))); if(a.errors.length) process.exit(1);"
      - name: Build production bundle
        run: npm run build
